# ============================================================
# User Service — Docker Configuration
# Activated via SPRING_PROFILES_ACTIVE=docker
# ============================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:fullstack_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate

logging.level.root=INFO
logging.level.com.template.app=INFO
